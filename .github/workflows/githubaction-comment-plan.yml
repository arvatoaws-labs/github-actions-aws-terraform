name: 'TofuPlan'

env:
  OPENTOFU_VERSION: "1.12.4"
  
on:
  workflow_call:
    inputs:
      region:
        required: true
        type: string
      roleArn:
        required: true
        type: string
      s3bucketName:
        required: true
        type: string
      github_event_number:
        required: true
        type: string
      github_event_issue_comments_url:
        required: true
        type: string
      stack:
        required: false
        type: string
        default: "."
      profiles:
        required: false
        type: string
        default: "[]"
      environment:
        required: false
        type: string
        default: "none"
      execute:
        required: true
        type: boolean
        default: false
      excluded_resources:
        required: false
        type: string
        default: 
          "
            module.opswatch_account
          "
    secrets: # 2. Explicitly declare required secrets for cross-org calls
      TERRAFORM_GITHUB_ACTION_CLIENT_ID:
        required: true
      TERRAFORM_GITHUB_ACTION_PRIVATE_KEY:
        required: true
      TERRAFORM_GITHUB_ACTION_APP_ID:
        required: true
      TF_VAR_SDMSI_SUBSCRIPTION_KEY:
        required: true
      TF_VAR_SDMS_OCP_APIM_SUBSCRIPTION_KEY:
        required: true
      TF_VAR_SDMS_AUTH_RESOURCE:
        required: true
      TF_VAR_SDMS_CLIENT_SECRET:
        required: true

jobs:
  tofu:
    name: 'Plan Tofu'
    runs-on: arvato
    permissions:
      actions: read
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
    if: ${{ inputs.execute == true }}

    steps:
    - name: Configure AWS Credentials via Profile 0
      if: ${{ fromJSON(inputs.profiles)[0] != null }}
      id: configure-aws-credentials-0
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[0].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[0].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[0].name }}

    - name: Configure AWS Credentials via Profile 1
      if: ${{ fromJSON(inputs.profiles)[1] != null }}
      id: configure-aws-credentials-1
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[1].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[1].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[1].name }}

    - name: Configure AWS Credentials via Profile 2
      if: ${{ fromJSON(inputs.profiles)[2] != null }}
      id: configure-aws-credentials-2
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[2].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[2].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[2].name }}
        
    - name: Configure AWS Credentials via Profile 3
      if: ${{ fromJSON(inputs.profiles)[3] != null }}
      id: configure-aws-credentials-3
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[3].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[3].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[3].name }}
  
    - name: Configure AWS Credentials via Profile 4
      if: ${{ fromJSON(inputs.profiles)[4] != null }}
      id: configure-aws-credentials-4
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[4].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[4].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[4].name }}

    - name: Configure AWS Credentials via Profile 5
      if: ${{ fromJSON(inputs.profiles)[5] != null }}
      id: configure-aws-credentials-5
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[5].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[5].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[5].name }}

    - name: Configure AWS Credentials via Profile 6
      if: ${{ fromJSON(inputs.profiles)[6] != null }}
      id: configure-aws-credentials-6
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[6].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[6].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[6].name }}

    - name: Initialize Error Log
      run: touch error_log.txt

    # Assume the role in AWS to roll out the changes
    - name: Configure AWS Credentials
      id: configure-aws-credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.region }}
        role-to-assume: ${{ inputs.roleArn }}
        role-session-name: GitHubTerraformDeployment

    # Get the github token with access to the relevant repositories from the app
    - name: Generate token
      id: generate-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ secrets.TERRAFORM_GITHUB_ACTION_CLIENT_ID }}
        private-key: ${{ secrets.TERRAFORM_GITHUB_ACTION_PRIVATE_KEY }}
        owner: arvatoaws

    # Configure github access
    - uses: de-vri-es/setup-git-credentials@v2
      id: configure-git-credentials
      with:
        credentials: https://oauth:${{ steps.generate-token.outputs.token }}@github.com/

    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      id: checkout-pull-request
      uses: actions/checkout@v6
      with:
        ref: refs/pull/${{ inputs.github_event_number }}/merge
        fetch-depth: 0

    - name: Check branch status (on pull request)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: github.event_name == 'pull_request'
      run: |
        set -x
        TIMESTAMP=`date "+%Y-%m-%d %H:%M:%S"`

        # Fetch the base branch (e.g., main)
        git fetch origin ${{ github.base_ref }}
        
        # Find the latest commit on the base branch
        BASE_SHA=$(git rev-parse origin/${{ github.base_ref }})
        
        # Find the common ancestor (merge base) between the PR and the Base
        MERGE_BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
        
        if [ "$BASE_SHA" = "$MERGE_BASE" ]; then
          echo "Branch is up to date."
          echo "is_outdated=false" >> $GITHUB_OUTPUT
        else
          gh label create "outdated" --color "ff0000" --force
          gh pr edit ${{ inputs.github_event_number }} --add-label "outdated" || true

          echo "$TIMESTAMP: PR branch is out of date with **${{ github.base_ref }}** - **${{ inputs.stack }}** (env: ${{ inputs.environment }})" >> error_log.txt

          echo "is_outdated=true" >> $GITHUB_OUTPUT
          exit 1 # Fail the step if it's out of date
        fi

    - name: Check branch status (on issue comment)
      if: github.event.issue.pull_request
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -x
        TIMESTAMP=`date "+%Y-%m-%d %H:%M:%S"`

        # 1. Get branch info via GitHub CLI
        PR_DATA=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json baseRefName,headRefName)
        BASE_BRANCH=$(echo $PR_DATA | jq -r '.baseRefName')
        HEAD_BRANCH=$(echo $PR_DATA | jq -r '.headRefName')

        echo "Comparing $HEAD_BRANCH against $BASE_BRANCH"

        # 2. Fetch both branches explicitly
        git fetch origin $BASE_BRANCH:$BASE_BRANCH
        git fetch origin $HEAD_BRANCH:$HEAD_BRANCH

        # 3. Compare
        BASE_SHA=$(git rev-parse $BASE_BRANCH)
        MERGE_BASE=$(git merge-base $HEAD_BRANCH $BASE_BRANCH)

        if [ "$BASE_SHA" != "$MERGE_BASE" ]; then
          echo "$TIMESTAMP: PR branch is out of date with $BASE_BRANCH - **${{ inputs.stack }}** (env: ${{ inputs.environment }})" >> error_log.txt

          echo "::error::PR branch is out of date with $BASE_BRANCH"
          gh label create "outdated" --color "ff0000" --force
          gh pr edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "outdated" || true
          exit 1
        else
          echo "PR is up to date!"
        fi

    - name: Reading Terraform variables from GitHub Secrets
      id: read-github-secrets
      run: |
        SECRETS_JSON='${{ toJson(secrets) }}'
        SECRETS=$(echo "$SECRETS_JSON" | jq -r 'keys[]')
        # Loop over each secret in the GitHub Actions environment
        for key in $SECRETS; do
          value=$(echo "$SECRETS_JSON" | jq -r ".[\"$key\"]")
          # Check if the secret name has the prefix "TF_VAR_"
          if [[ $key == TF_VAR_* ]]; then
            # Add the secret as an input variable to the tofu command
            export "$key=$value"
            echo "${key#TF_VAR_} = \"$value\"" >> ${{ github.workspace }}/secret_variables.tfvars
          fi
        done
      shell: bash

    # 1. Stash the host-generated profiles safely inside the workspace
    - name: Stage AWS Config for Container Access
      run: |
        if [ -d "$HOME/.aws" ]; then
          mkdir -p ${{ github.workspace }}/.aws-profiles
          cp -r $HOME/.aws/* ${{ github.workspace }}/.aws-profiles/
          echo "AWS profiles successfully staged for container access."
        else
          echo "No AWS profiles found to stage."
        fi
      shell: bash

    - name: terraform plan ${{ inputs.stack }}
      id: tfplan
      uses: dflook/tofu-plan@v2
      with:
        path: ${{ inputs.stack }}
        add_github_comment: always-new
        label: ${{ inputs.stack }} (${{ inputs.environment }})
        var_file: |
          secret_variables.tfvars
        exclude: |
          ${{ inputs.excluded_resources }}
      env:
        TF_PLAN_COLLAPSE_LENGTH: 1000  # Set this high to keep it expanded
        TERRAFORM_HTTP_CREDENTIALS: |
          github.com/arvatoaws=oauth:${{ steps.generate-token.outputs.token }}
        GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        TERRAFORM_ACTIONS_GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        GITHUB_APP_ID: ${{ secrets.TERRAFORM_GITHUB_ACTION_APP_ID }}
        GITHUB_APP_PEM_FILE: ${{ secrets.TERRAFORM_GITHUB_ACTION_PRIVATE_KEY }}
        TERRAFORM_PRE_RUN: |
          # 2. Hydrate the container's native home directory with the staged profiles
          if [ -d "/github/workspace/.aws-profiles" ]; then
            mkdir -p ~/.aws
            cp -r /github/workspace/.aws-profiles/* ~/.aws/
            echo "AWS profiles successfully mapped inside the container."
          fi

          # Install AWS CLI
          curl "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o "awscliv2.zip"
          unzip -qq awscliv2.zip
          ./aws/install
          /usr/local/bin/aws --version

    - name: Add Successful labels to GitHub PR
      id: add-success-labels-to-pull-request

      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -x
        TIMESTAMP=`date "+%Y-%m-%d %H:%M:%S"`

        gh pr edit ${{ inputs.github_event_number }} --remove-label "terraform-${{ inputs.stack }}-failed" || true
        gh pr edit ${{ inputs.github_event_number }} --remove-label "terraform-${{ inputs.stack }}-plan-no_changes" || true
        gh pr edit ${{ inputs.github_event_number }} --remove-label "outdated" || true

        gh label create "terraform-${{ inputs.stack }}-planned" --color "008000" --force
        gh pr edit ${{ inputs.github_event_number }} --add-label "terraform-${{ inputs.stack }}-planned"

        if [ "${{ steps.tfplan.outputs.changes }}" == "false" ] 
          then
            gh label create "terraform-${{ inputs.stack }}-plan-no_changes" --force
            gh pr edit ${{ inputs.github_event_number }} --add-label "terraform-${{ inputs.stack }}-plan-no_changes"
        fi
        
        echo "$TIMESTAMP: Tofu plan successful on **${{ inputs.stack }}** (env: ${{ inputs.environment }})" >> error_log.txt

    - name: Add Failed labels to GitHub PR
      id: add-failed-labels-to-pull-request
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -x
        TIMESTAMP=`date "+%Y-%m-%d %H:%M:%S"`

        gh label create "terraform-${{ inputs.stack }}-failed" --color "ff0000" --force
        gh pr edit ${{ inputs.github_event_number }} --add-label "terraform-${{ inputs.stack }}-failed" || true
        gh pr edit ${{ inputs.github_event_number }} --remove-label "terraform-${{ inputs.stack }}-planned" || true
        gh pr edit ${{ inputs.github_event_number }} --remove-label "terraform-${{ inputs.stack }}-plan-no_changes" || true


        echo "$TIMESTAMP: Tofu plan failed on **${{ inputs.stack }}** (env: ${{ inputs.environment }})" >> error_log.txt

    - name: Report Results
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -s error_log.txt ]; then
          gh pr comment ${{ inputs.github_event_number }} --body-file error_log.txt --repo ${{ github.repository }}
        fi