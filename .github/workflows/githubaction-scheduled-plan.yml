name: 'TofuPlanScheduled'

on:
  workflow_call:
    inputs:
      region:
        required: true
        type: string
      roleArn:
        required: true
        type: string
      stack:
        required: false
        type: string
        default: "."
      profiles:
        required: false
        type: string
        default: "[]"
      environment:
        required: false
        type: string
        default: "none"
      execute:
        required: true
        type: boolean
        default: false
      owner:
        required: false
        type: string
        default: "arvatoaws"
    secrets: # 2. Explicitly declare required secrets for cross-org calls
      TERRAFORM_GITHUB_ACTION_CLIENT_ID:
        required: true
      TERRAFORM_GITHUB_ACTION_PRIVATE_KEY:
        required: true
      TERRAFORM_GITHUB_ACTION_APP_ID:
        required: true
      TF_VAR_SDMSI_SUBSCRIPTION_KEY:
        required: true
      TF_VAR_SDMS_OCP_APIM_SUBSCRIPTION_KEY:
        required: true
      TF_VAR_SDMS_AUTH_RESOURCE:
        required: true
      TF_VAR_SDMS_CLIENT_SECRET:
        required: true
jobs:
  tofu:
    name: 'Plan Tofu'
    runs-on: arvato

    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
    if: ${{ inputs.execute == true }}

    steps:
    - name: Configure AWS Credentials via Profile 0
      if: ${{ fromJSON(inputs.profiles)[0] != null }}
      id: configure-aws-credentials-0
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[0].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[0].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[0].name }}

    - name: Configure AWS Credentials via Profile 1
      if: ${{ fromJSON(inputs.profiles)[1] != null }}
      id: configure-aws-credentials-1
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[1].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[1].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[1].name }}

    - name: Configure AWS Credentials via Profile 2
      if: ${{ fromJSON(inputs.profiles)[2] != null }}
      id: configure-aws-credentials-2
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[2].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[2].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[2].name }}
        
    - name: Configure AWS Credentials via Profile 3
      if: ${{ fromJSON(inputs.profiles)[3] != null }}
      id: configure-aws-credentials-3
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[3].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[3].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[3].name }}
  
    - name: Configure AWS Credentials via Profile 4
      if: ${{ fromJSON(inputs.profiles)[4] != null }}
      id: configure-aws-credentials-4
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[4].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[4].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[4].name }}

    - name: Configure AWS Credentials via Profile 5
      if: ${{ fromJSON(inputs.profiles)[5] != null }}
      id: configure-aws-credentials-5
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[5].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[5].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[5].name }}

    - name: Configure AWS Credentials via Profile 6
      if: ${{ fromJSON(inputs.profiles)[6] != null }}
      id: configure-aws-credentials-6
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ fromJSON(inputs.profiles)[6].region }}
        role-to-assume: ${{ fromJSON(inputs.profiles)[6].roleArn }}
        aws-profile: ${{ fromJSON(inputs.profiles)[6].name }}

    # Assume the role in AWS to roll out the changes
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.region }}
        role-to-assume: ${{ inputs.roleArn }}
    # Get the github token with access to the relevant repositories from the app
    - name: Generate token
      id: generate-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ secrets.TERRAFORM_GITHUB_ACTION_CLIENT_ID }}
        private-key: ${{ secrets.TERRAFORM_GITHUB_ACTION_PRIVATE_KEY }}
        owner: ${{ inputs.owner }}
    # Configure github access
    - uses: de-vri-es/setup-git-credentials@v2
      with:
        credentials: https://oauth:${{ steps.generate-token.outputs.token }}@github.com/

    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v6

    - name: Reading Terraform variables from GitHub Secrets
      id: generate-tf-secrets
      run: |
        echo "" > ${{ github.workspace }}/secret_variables.tfvars
        SECRETS_JSON='${{ toJson(secrets) }}'
        SECRETS=$(echo "$SECRETS_JSON" | jq -r 'keys[]')
        # Loop over each secret in the GitHub Actions environment
        for key in $SECRETS; do
          value=$(echo "$SECRETS_JSON" | jq -r ".[\"$key\"]")
          # Check if the secret name has the prefix "TF_VAR_"
          if [[ $key == TF_VAR_* ]]; then
            # Add the secret as an input variable to the tofu command
            export "$key=$value"
            echo "${key#TF_VAR_} = \"$value\"" >> ${{ github.workspace }}/secret_variables.tfvars
          fi
        done
      shell: bash

    # 1. Stash the host-generated profiles safely inside the workspace
    - name: Stage AWS Config for Container Access
      run: |
        if [ -d "$HOME/.aws" ]; then
          mkdir -p ${{ github.workspace }}/.aws-profiles
          cp -r $HOME/.aws/* ${{ github.workspace }}/.aws-profiles/
        fi
      shell: bash

    - name: terraform plan ${{ inputs.stack }}
      uses: dflook/tofu-plan@v2
      with:
        path: ${{ inputs.stack }}
        var_file: |
          secret_variables.tfvars
      env:
        OPENTOFU_VERSION: 1.11.5
        TERRAFORM_HTTP_CREDENTIALS: |
          github.com/arvatoaws=oauth:${{ steps.generate-token.outputs.token }}
        GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        TERRAFORM_ACTIONS_GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        GITHUB_APP_ID: ${{ secrets.TERRAFORM_GITHUB_ACTION_APP_ID }}
        GITHUB_APP_PEM_FILE: ${{ secrets.TERRAFORM_GITHUB_ACTION_PRIVATE_KEY }}
        TERRAFORM_PRE_RUN: |
          # 2. Hydrate the container's native home directory with the staged profiles
          if [ -d "/github/workspace/.aws-profiles" ]; then
            mkdir -p ~/.aws
            cp -r /github/workspace/.aws-profiles/* ~/.aws/
            echo "AWS profiles successfully mapped inside the container."
          fi

          # Install AWS CLI for X86
          curl "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          ./aws/install
          /usr/local/bin/aws --version